<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" fill="none" stroke="#8A929B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Architectural Grid Axes & Bubbles -->
  <g opacity="0.65" stroke-dasharray="4 4" stroke-width="0.8">
    <line x1="80" y1="40" x2="80" y2="560" />
    <line x1="220" y1="40" x2="220" y2="560" />
    <line x1="380" y1="40" x2="380" y2="560" />
    <line x1="540" y1="40" x2="540" y2="560" />
    <line x1="40" y1="120" x2="660" y2="120" />
    <line x1="40" y1="260" x2="660" y2="260" />
    <line x1="40" y1="420" x2="660" y2="420" />
  </g>

  <!-- Axis Grid Bubbles (Top) -->
  <g font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#8A929B" text-anchor="middle" dominant-baseline="central">
    <circle cx="80" cy="30" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="80" y="30">1</text>
    <circle cx="220" cy="30" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="220" y="30">2</text>
    <circle cx="380" cy="30" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="380" y="30">3</text>
    <circle cx="540" cy="30" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="540" y="30">4</text>
  </g>

  <!-- Axis Grid Bubbles (Right) -->
  <g font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#8A929B" text-anchor="middle" dominant-baseline="central">
    <circle cx="670" cy="120" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="670" y="120">A</text>
    <circle cx="670" cy="260" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="670" y="260">B</text>
    <circle cx="670" cy="420" r="12" fill="#ffffff" stroke="#8A929B" stroke-width="1.2" />
    <text x="670" y="420">C</text>
  </g>

  <!-- Exterior Thick Walls -->
  <g stroke-width="2.5" stroke="#64748B">
    <rect x="80" y="120" width="460" height="300" />
    <!-- Step out / bay feature -->
    <polyline points="380,420 380,480 540,480 540,420" />
    <!-- Entry cantilever recess -->
    <polyline points="80,220 140,220 140,290 80,290" />
  </g>

  <!-- Interior Wall Framing (Double line structural steel stud framing) -->
  <g stroke-width="1.4" stroke="#8A929B">
    <!-- Main Corridor Wall -->
    <line x1="220" y1="120" x2="220" y2="420" />
    <line x1="228" y1="120" x2="228" y2="420" />

    <!-- Dividing Bedroom 1 & 2 -->
    <line x1="80" y1="260" x2="220" y2="260" />
    <line x1="80" y1="268" x2="220" y2="268" />

    <!-- Kitchen / Living Zone -->
    <line x1="380" y1="120" x2="380" y2="340" />
    <line x1="388" y1="120" x2="388" y2="340" />

    <line x1="380" y1="260" x2="540" y2="260" />
    <line x1="380" y1="268" x2="540" y2="268" />
  </g>

  <!-- Door Swings (Arcs) -->
  <g stroke-width="1" stroke="#8A929B" fill="none">
    <!-- Door 1 -->
    <line x1="220" y1="170" x2="220" y2="205" stroke-dasharray="2 2" />
    <path d="M 220,170 A 35,35 0 0,1 255,205" />
    <line x1="220" y1="205" x2="255" y2="205" stroke-width="1.5" />

    <!-- Door 2 -->
    <path d="M 220,310 A 35,35 0 0,0 255,275" />
    <line x1="220" y1="275" x2="255" y2="275" stroke-width="1.5" />

    <!-- Door 3 (Master Suite) -->
    <path d="M 380,210 A 35,35 0 0,1 345,175" />
    <line x1="380" y1="175" x2="345" y2="175" stroke-width="1.5" />
  </g>

  <!-- Windows (Triple lines) -->
  <g stroke-width="1" stroke="#64748B">
    <!-- North Windows -->
    <line x1="120" y1="117" x2="180" y2="117" />
    <line x1="120" y1="123" x2="180" y2="123" />

    <line x1="260" y1="117" x2="340" y2="117" />
    <line x1="260" y1="123" x2="340" y2="123" />

    <line x1="420" y1="117" x2="500" y2="117" />
    <line x1="420" y1="123" x2="500" y2="123" />

    <!-- South Windows -->
    <line x1="410" y1="483" x2="510" y2="483" />
    <line x1="410" y1="477" x2="510" y2="477" />
  </g>

  <!-- Dimension Lines & Measurement Ticks -->
  <g stroke-width="0.9" stroke="#8A929B" font-family="monospace, sans-serif" font-size="9" fill="#8A929B" text-anchor="middle">
    <!-- Top Overall Dimension -->
    <line x1="80" y1="75" x2="540" y2="75" />
    <line x1="80" y1="68" x2="80" y2="82" />
    <line x1="220" y1="70" x2="220" y2="80" />
    <line x1="380" y1="70" x2="380" y2="80" />
    <line x1="540" y1="68" x2="540" y2="82" />
    <text x="150" y="70">4200</text>
    <text x="300" y="70">4800</text>
    <text x="460" y="70">4800</text>

    <!-- Left Overall Dimension -->
    <line x1="45" y1="120" x2="45" y2="420" />
    <line x1="38" y1="120" x2="52" y2="120" />
    <line x1="40" y1="260" x2="50" y2="260" />
    <line x1="38" y1="420" x2="52" y2="420" />
    <text x="32" y="190" transform="rotate(-90 32 190)">4200</text>
    <text x="32" y="340" transform="rotate(-90 32 340)">4800</text>
  </g>

  <!-- Structural Column Footing Markers (Steel Posts) -->
  <g fill="#1E63D8" opacity="0.6">
    <rect x="76" y="116" width="8" height="8" />
    <rect x="216" y="116" width="8" height="8" />
    <rect x="376" y="116" width="8" height="8" />
    <rect x="536" y="116" width="8" height="8" />
    <rect x="76" y="416" width="8" height="8" />
    <rect x="216" y="416" width="8" height="8" />
    <rect x="376" y="476" width="8" height="8" />
    <rect x="536" y="476" width="8" height="8" />
  </g>

  <!-- Technical Drawing Legend & North Arrow -->
  <g stroke-width="1" stroke="#8A929B" font-family="monospace, sans-serif" font-size="9" fill="#8A929B">
    <!-- North Arrow -->
    <circle cx="580" cy="180" r="18" fill="none" stroke-width="1" />
    <polygon points="580,166 575,183 580,180" fill="#64748B" />
    <polygon points="580,166 585,183 580,180" fill="none" />
    <text x="580" y="160" text-anchor="middle" font-weight="bold">N</text>

    <!-- Drawing Title Block -->
    <text x="460" y="525" font-weight="bold" font-size="10" fill="#0F1114">STRUCTURAL FRAMING PLAN</text>
    <text x="460" y="540" font-size="8">LGS COLD-FORMED SPEC: AS/NZS 4600</text>
    <text x="460" y="552" font-size="8">SCALE 1:100 @ A1 · TRUECORE® G550</text>
  </g>
</svg>
